name: build-unofficial-desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag or commit (e.g. dsh-v0.2.3-alpha.2)"
        required: true
        default: "dsh-v0.2.3-alpha.2"
      publish:
        description: "Create a GitHub Release with the built installers"
        type: choice
        options:
          - "false"
          - "true"
        default: "true"
      macos:
        description: "Also build macOS (requires a supported macOS runner)"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

concurrency:
  group: dsh-build-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ github.event.inputs.ref }}
          path: src
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src
        run: pnpm run build

      - name: Write desktop env
        working-directory: src/apps/desktop
        shell: bash
        run: |
          cat > .env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.github.zhiting98.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.invalid"]}'
          DOWNLOAD_TEST_ORIGIN=https://downloads.invalid
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          EOF

      - name: Prepare desktop package
        working-directory: src
        run: pnpm run prepare:desktop

      - name: Package Windows x64 (unsigned)
        working-directory: src
        run: pnpm run package:desktop:win:x64:unsigned

      - name: List Windows output
        working-directory: src/apps/desktop
        shell: pwsh
        run: |
          Get-ChildItem -File .desktop-build/targets/win-x64/unsigned-artifacts -Include *.exe,*.msi,*.zip,*.blockmap |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            src/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            src/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.msi
            src/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.zip
            src/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mac-arm64:
    name: macOS arm64
    if: github.event.inputs.macos == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ github.event.inputs.ref }}
          path: src
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src
        run: pnpm run build

      - name: Write desktop env
        working-directory: src/apps/desktop
        shell: bash
        run: |
          cat > .env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.github.zhiting98.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.invalid"]}'
          DOWNLOAD_TEST_ORIGIN=https://downloads.invalid
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4
          DSH_DESKTOP_MACOS_ZIP_COMPRESSION_LEVEL=3
          EOF

      - name: Prepare desktop package
        working-directory: src
        run: pnpm run prepare:desktop

      - name: Package macOS arm64 (unsigned)
        working-directory: src
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            src/apps/desktop/**/*.dmg
            src/apps/desktop/**/*.zip
          if-no-files-found: warn
          retention-days: 14

  mac-x64:
    name: macOS x64
    if: github.event.inputs.macos == 'true'
    runs-on: macos-13
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ github.event.inputs.ref }}
          path: src
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src
        run: pnpm run build

      - name: Write desktop env
        working-directory: src/apps/desktop
        shell: bash
        run: |
          cat > .env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.github.zhiting98.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.invalid"]}'
          DOWNLOAD_TEST_ORIGIN=https://downloads.invalid
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4
          DSH_DESKTOP_MACOS_ZIP_COMPRESSION_LEVEL=3
          EOF

      - name: Prepare desktop package
        working-directory: src
        run: pnpm run prepare:desktop

      - name: Package macOS x64 (unsigned)
        working-directory: src
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: |
            src/apps/desktop/**/*.dmg
            src/apps/desktop/**/*.zip
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    if: always() && github.event.inputs.publish == 'true' && needs.windows-x64.result == 'success'
    needs:
      - windows-x64
      - mac-arm64
      - mac-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref }}-unofficial.1
          name: "DSH ${{ github.event.inputs.ref }} (unofficial build)"
          draft: false
          prerelease: true
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.zip
            dist/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
          body: |
            Unofficial desktop build of DSH, compiled from
            `deepseek-ai/deepseek-harness` at `${{ github.event.inputs.ref }}`.

            **Not affiliated with or endorsed by DeepSeek.**

            Assets are unsigned. Verify `SHA256SUMS.txt` before running.
            License: MIT (see `LICENSE`); third-party notices in `THIRD_PARTY_NOTICES.md`.
