name: watch-upstream

on:
  schedule:
    # 每小时检查一次上游新版本；GitHub 不支持直接订阅另一个仓库的 release 事件，所以用轮询
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch-upstream
  cancel-in-progress: false

jobs:
  watch:
    name: Check upstream releases
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build for new upstream tag
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamOwner = 'deepseek-ai';
            const upstreamRepo = 'deepseek-harness';
            const localOwner = context.repo.owner;
            const localRepo = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: upstreamOwner, repo: upstreamRepo, per_page: 50 }
            );
            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner: upstreamOwner, repo: upstreamRepo, per_page: 100 }
            );
            const upstreamTags = Array.from(new Set([
              ...releases.map((r) => r.tag_name),
              ...tags.map((t) => t.name),
            ])).filter((t) => /^dsh-v\d/.test(t));

            const localTags = await github.paginate(
              github.rest.repos.listTags,
              { owner: localOwner, repo: localRepo, per_page: 100 }
            );
            const local = new Set(localTags.map((t) => t.name));

            const missing = upstreamTags.filter(
              (t) => !local.has(t) && !local.has(`${t}-unofficial.1`)
            );

            core.info(`upstream tags: ${upstreamTags.length}`);
            core.info(`missing: ${missing.length}${missing.length ? ' -> ' + missing.join(', ') : ''}`);

            // 一次只触发一个，避免同时排队多个大构建；下一轮会继续处理剩余版本
            if (missing.length > 0) {
              const tag = missing[0];
              await github.rest.actions.createWorkflowDispatch({
                owner: localOwner,
                repo: localRepo,
                workflow_id: 'build.yml',
                ref: 'main',
                inputs: {
                  ref: tag,
                  publish: 'true',
                  macos: 'false',
                },
              });
              core.info(`dispatched build.yml for ${tag}`);
            } else {
              core.info('nothing to do');
            }
